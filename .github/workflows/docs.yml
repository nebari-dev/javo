name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/docs.yml'

permissions:
  contents: read

env:
  # corepack fetches pnpm without asking.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

# One publish at a time; a newer push replaces a waiting one.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      # The commit's files from GitHub's tarball endpoint: under a second,
      # where actions/checkout's git fetch takes 8 to 16 s on these runners.
      # Nothing here needs the git history.
      - &source
        name: Fetch the commit
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" |
            tar -xz --strip-components=1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # pnpm through Node's corepack, at the version and sha512 that
      # site/package.json's packageManager names.
      - run: corepack enable pnpm
      # pnpm's store (downloaded packages): saved from main, read by every ref.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: pnpm-store
        with:
          path: ~/.pnpm-store
          key: pnpm-store-site-${{ hashFiles('site/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-site-
      # Lifecycle scripts stay off: no dependency runs code at install.
      - run: pnpm install --frozen-lockfile --ignore-scripts --store-dir ~/.pnpm-store
      - run: pnpm exec astro build
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.ref == 'refs/heads/main' && steps.pnpm-store.outputs.cache-hit != 'true'
        with:
          path: ~/.pnpm-store
          key: ${{ steps.pnpm-store.outputs.cache-primary-key }}
      # On main, the built site is what javo.nebari.dev serves.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: site/dist

  deploy:
    name: Publish to javo.nebari.dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
