# The in-cluster Git server of the end-to-end tests (scripts/test/e2e-git-up.sh,
# JAVO_E2E_GIT=1). It answers https on port 443 under the name gitea, with a
# self-signed certificate for github.com: the dev cluster's DNS sends
# github.com to this Service, and source.gitConfig turns off certificate
# checks for the clones, so apps use ordinary https://github.com/<owner>/<repo>
# addresses. Everything lives in emptyDirs: a new pod starts empty. The admin
# password comes from Secret gitea-admin, made by the script. Never shipped.
apiVersion: v1
kind: Namespace
metadata:
  name: javo-e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: javo-e2e
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: gitea}
  template:
    metadata:
      labels: {app: gitea}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gitea
          image: gitea/gitea:28.2.0-rootless@sha256:94807314454f6525994a3b76286ba12bc7e7f8cd14f61d9e67431767f8103306
          # The entrypoint writes app.ini from the GITEA__ variables, then runs
          # this: make the certificate, create the database and the admin user, serve.
          command: ["/usr/local/bin/docker-entrypoint.sh", "sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /tmp/tls
              cd /tmp/tls
              gitea cert --host github.com
              mv cert.p[e]m tls-crt
              mv key.p[e]m tls-priv
              cd /
              gitea -c "$GITEA_APP_INI" migrate
              # The emptyDirs outlive a container restart (a k3s restart),
              # so the admin may exist already: then set its password.
              gitea -c "$GITEA_APP_INI" admin user create --admin --username e2e-admin \
                --password "$GITEA_ADMIN_PASSWORD" --email e2e-admin@example.com --must-change-password=false ||
                gitea -c "$GITEA_APP_INI" admin user change-password --username e2e-admin \
                  --password "$GITEA_ADMIN_PASSWORD" --must-change-password=false
              exec gitea -c "$GITEA_APP_INI" web
          env:
            - name: GITEA_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: gitea-admin, key: password}}
            - {name: GITEA__security__INSTALL_LOCK, value: "true"}
            - {name: GITEA__database__DB_TYPE, value: sqlite3}
            - {name: GITEA__database__PATH, value: /var/lib/gitea/data/gitea.db}
            - {name: GITEA__server__PROTOCOL, value: https}
            - {name: GITEA__server__CERT_FILE, value: /tmp/tls/tls-crt}
            - {name: GITEA__server__KEY_FILE, value: /tmp/tls/tls-priv}
            - {name: GITEA__server__DOMAIN, value: github.com}
            - {name: GITEA__server__ROOT_URL, value: "https://github.com/"}
            - {name: GITEA__server__HTTP_PORT, value: "3000"}
            - {name: GITEA__server__DISABLE_SSH, value: "true"}
            - {name: GITEA__service__DISABLE_REGISTRATION, value: "true"}
            - {name: GITEA__service__REQUIRE_SIGNIN_VIEW, value: "false"}
            - {name: GITEA__repository__DEFAULT_BRANCH, value: main}
          ports:
            - {name: https, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /api/healthz, port: https, scheme: HTTPS}
            periodSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: conf, mountPath: /etc/gitea}
            - {name: data, mountPath: /var/lib/gitea}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: conf, emptyDir: {}}
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: javo-e2e
spec:
  selector: {app: gitea}
  ports:
    - {name: https, port: 443, targetPort: https}
