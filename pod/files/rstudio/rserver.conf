# Read from RSTUDIO_CONFIG_DIR. The server runs as the pod user, without privilege.
auth-none=1
www-address=0.0.0.0
server-daemonize=0
# Scratch state goes to /tmp (an emptyDir in the pod); the root filesystem is
# not writable by this user, and nothing here needs to outlive the pod.
server-data-dir=/tmp/rstudio-server-data
server-pid-file=/tmp/rserver.pid
server-working-dir=/tmp
rsession-which-r=/usr/local/bin/R
