[workspace]
name = "agents"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
exclude-newer = "2026-10-26"

[dependencies]
nodejs = "==22.23.4"
ttyd = "==1.7.7"
tmux = "==3.8_"
git = "==2.56.0"
ripgrep = "==15.2.0"
fd-find = "==10.5.0"
less = "==704"
herdr = "==0.9.5"
pi-coding-agent = "==1.4.0"

# Claude Code stays at the version package-lock.json pins and DEPENDENCIES.md
# records: its own updater would replace it in the home folder with whatever
# ships next. Bump it through the lockfile instead.
[activation.env]
DISABLE_AUTOUPDATER = "1"
