[workspace]
name = "jobs-python"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]
exclude-newer = "2026-10-26"

[dependencies]
python = "==3.13.18"
quarto = "==1.9.38"
click = "==8.5.0"
jedi = "==0.19.2"
markdown = "==3.11.2"
pymdown-extensions = "==11.0.2"
pygments = "==2.21.0"
tomlkit = "==0.15.2"
pyyaml = "==6.0.3"
uvicorn = "==0.54.0"
starlette = "==1.10.0"
python-multipart = "==0.0.32"
websockets = "==17.3"
docutils = "==0.23"
psutil = "==7.2.2"
itsdangerous = "==2.2.0"
narwhals = "==2.27.1"
packaging = "==26.3"
msgspec = "==0.22.0"
pyzmq = "==27.2.0"

# tornado 6.6 (GHSA-pcg2-g6cj-q92c, GHSA-r4j5-9xpp-3985, GHSA-pw9p-v7r6-gx4p
# fixed) is not on conda-forge yet, so tornado and every package here that
# needs it come from PyPI (wheels, locked with their sha256). Move them back
# to conda-forge once tornado-feedstock has 6.6.
# marimo and loro (one of its dependencies) have no current linux-aarch64
# build on conda-forge (marimo stopped at 0.13.6), so these two come from PyPI
# (wheels, locked with their sha256); the rest of marimo's dependencies come
# from conda-forge.
[pypi-dependencies]
papermill = "==2.7.0"
ipykernel = "==7.4.0"
nbconvert = "==7.17.2"
tornado = "==6.6"
marimo = "==0.25.2"
loro = "==1.17.1"
