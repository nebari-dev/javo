[workspace]
name = "jupyterlab"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
exclude-newer = "2026-10-26"

[dependencies]
python = "==3.13.18"
git = "==2.56.0"
dask-core = "==2026.8.0"
matplotlib-base = "==3.11.2"

# tornado 6.6 (GHSA-pcg2-g6cj-q92c, GHSA-r4j5-9xpp-3985, GHSA-pw9p-v7r6-gx4p
# fixed) is not on conda-forge yet, so tornado and every package here that
# needs it come from PyPI (wheels, locked with their sha256). Move them back
# to conda-forge once tornado-feedstock has 6.6.
[pypi-dependencies]
jupyterlab = "==4.6.4"
ipykernel = "==7.4.0"
ipywidgets = "==8.1.9"
papermill = "==2.7.0"
tornado = "==6.6"
# Extensions (from PyPI for the same reason: each needs jupyter_server or
# tornado). Git panel, Dask cluster panel and dashboards, proxied web apps
# (/proxy/<port>, which the Dask dashboard uses), memory and CPU meter,
# interactive matplotlib (%matplotlib widget).
jupyterlab-git = "==0.55.0"
dask-labextension = "==7.0.0"
distributed = "==2026.8.0"
jupyter-server-proxy = "==4.6.0"
jupyter-resource-usage = "==1.3.0"
ipympl = "==0.10.0"

# Lists the person's Nebi environments as Jupyter kernels (nb_nebi_kernels,
# a KernelSpecManager); jupyter_server_config.py here turns it on only in
# apps that get their owner's Nebi token (spec.nebiToken).
nb_nebi_kernels = "==0.3"
# The launcher of the Nebari data science pack (jupyterlab-launchpad): it
# shows the Nebi tile of jupyter_server_config.py, and the Nebi columns and
# actions (pull, install dependencies) for Nebi kernels.
jupyterlab-launchpad = "==1.2.1"
