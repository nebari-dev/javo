# tmux settings for the coding agent templates (tmux -f, from the pod files): the
# project owner's own tmux config (dotfiles home/.tmux.conf at commit
# 7124585b), with the lines a container cannot use dropped or adapted (each
# one is marked) and the settings javo needs added at the end. Inert lines
# (commented-out settings, a status-right that a later line replaced, a
# repeated mode-keys) are left out.

# C-b is not acceptable -- Vim uses it. Set Alt-b as the prefix
unbind C-b
set -g prefix '\'     # or `
bind-key '\' send-prefix  # Without this forget backtick forever (in tmux)

# Reload
unbind r
# Adapted: the config is /etc/tmux.conf here, not ~/.tmux.conf.
bind r source-file /etc/tmux.conf

set -g mouse on

set-option -g allow-rename off  # Keep tab names fixed
set -g history-limit 8192
# Start numbering at 1
set -g base-index 1

bind -n C-k clear-history
bind-key k clear-history

# Allows for faster key repetition
set -s escape-time 0

# Enable extended keys for proper handling of modified key combinations.
# Lets the agents tell Shift+Enter from Enter (tmux 3.2 or newer).
set -g extended-keys on
# A tmux 3.5 option; the environment's tmux is 3.8.
set -g extended-keys-format csi-u

# Set status bar
set -g status-bg black
set -g status-fg white
set -g status-left ""
set -g status-right-length 120
set -g status-interval 60

setw -g aggressive-resize off

# Highlight active window
set-window-option -g window-status-current-style "bg=cyan,fg=black,bold"

# Smart pane switching with awareness of vim splits
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-L if-shell "$is_vim" "send-keys C-l" "select-pane -R" #C-l conflicts with clear command

# Send Ctrl-l to clear screen
bind -n C-l send-keys 'C-l'
bind -n M-Right next-window
bind -n M-Left previous-window

# Adapted: the original shows harvest's status and the battery (tmux-battery
# plugin) before the date; neither exists in a container, so only the date.
set -g status-right "%a %h-%d %H:%M "

setw -g mode-keys vi

# Dropped: the plugin list (tpm, tmux-resurrect, tmux-continuum,
# tmux-copycat, tmux-yank, tmux-pain-control, tmux-cpu, tmux-battery), the
# `run '~/.tmux/plugins/tpm/tpm'` line and tmux-yank's `@shell_mode`. TPM
# clones the plugins from GitHub at run time, unpinned, into the home; the
# environment installs nothing that way. tmux-yank's job (copy to the clipboard) is
# done by set-clipboard below.

# Move tabs left right
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

set -g default-command "exec $SHELL"
set -g update-environment "PATH CONDA_PREFIX VIRTUAL_ENV PYENV_ROOT"

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm-256color:Tc:sitm=\E[3m:ritm=\E[23m'

# javo: a selection made with the mouse (drag, double or triple click) is
# copied to the browser's clipboard. tmux sends it to ttyd's page as OSC 52
# (ttyd's TERM, xterm-256color, has tmux's clipboard feature), and the page
# writes it to the clipboard (pod/terminal). "external": tmux sends only its
# own copies; OSC 52 that a program in a pane prints is not passed on, so a
# command's output cannot replace the clipboard.
set -g set-clipboard external

# javo: tmux runs with -f naming this file, so it reads no other; a user's own
# ~/.tmux.conf comes last and wins.
if-shell "test -f ~/.tmux.conf" "source-file ~/.tmux.conf"
