          - column: "device_logins.last_poll_at"
            go_type: {import: github.com/nebari-dev/javo/internal/store/dbtime, type: Time}
  - engine: postgresql
    schema: dialect/schema.sql
    queries: dialect/queries.sql
    gen:
      go:
        package: dialect
        out: dialect
        sql_package: database/sql
        overrides: *overrides
