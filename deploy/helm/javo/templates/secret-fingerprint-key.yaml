{{- /*
The key of the fingerprints of people's secret values: the controller, which
opens values, stores each value's length and HMAC-SHA256 under it, and the
gateway looks for them in an app's logs before they go to a model. Kept
outside the database, so a copy of the database cannot test guesses against
the fingerprints. 32 random bytes, made once and kept like the secrets key.
Losing it only means the controller makes the fingerprints again. Both
components mount it. secrets.existingFingerprintKeySecret names a Secret made
elsewhere instead.
*/ -}}
{{- if not .Values.secrets.existingFingerprintKeySecret }}
{{- $live := lookup "v1" "Secret" .Release.Namespace "javo-secret-fingerprint-key" }}
apiVersion: v1
kind: Secret
metadata:
  name: javo-secret-fingerprint-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
immutable: true
data:
  {{- if and $live $live.data (index $live.data "key") }}
  key: {{ index $live.data "key" }}
  {{- else }}
  key: {{ randBytes 32 }}
  {{- end }}
{{- end }}
