{{- /* Access for `javo import jupyterhub-homes`, only while
jupyterhubImport.namespace names a JupyterHub namespace. Written by hand: no
+kubebuilder:rbac marker grants it, so TestChartRBACMatchesMarkers renders
without it. */ -}}
{{- with .Values.jupyterhubImport.namespace }}
{{- $account := include "javo.account" (list $ "javo-controller") }}
---
# In JupyterHub's namespace: read the home claims, make the staging claim and
# the Job that fills it, follow its log, and delete both afterwards. The home
# claims themselves are never changed (the import only reads them).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: javo-jupyterhub-import
  namespace: {{ . }}
  labels:
    {{- include "javo.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: javo-jupyterhub-import
  namespace: {{ . }}
  labels:
    {{- include "javo.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: javo-jupyterhub-import
subjects:
  - kind: ServiceAccount
    name: {{ $account }}
    namespace: {{ $.Release.Namespace }}
---
# In the workspace namespace the controller already makes claims and Jobs;
# the import also follows the copy Job's log.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: javo-jupyterhub-import
  namespace: {{ $.Values.workspaceNamespace }}
  labels:
    {{- include "javo.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: javo-jupyterhub-import
  namespace: {{ $.Values.workspaceNamespace }}
  labels:
    {{- include "javo.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: javo-jupyterhub-import
subjects:
  - kind: ServiceAccount
    name: {{ $account }}
    namespace: {{ $.Release.Namespace }}
---
# Volumes are cluster scoped and cannot be narrowed by name ahead of time.
# The import patches only the staging volume it made: its reclaim policy (so
# it outlives its first claim, and goes when the import is done) and the
# claim it is reserved for in the workspace namespace. It never deletes one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $.Release.Name }}-{{ $.Release.Namespace }}-javo-jupyterhub-import
  labels:
    {{- include "javo.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Release.Name }}-{{ $.Release.Namespace }}-javo-jupyterhub-import
  labels:
    {{- include "javo.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-{{ $.Release.Namespace }}-javo-jupyterhub-import
subjects:
  - kind: ServiceAccount
    name: {{ $account }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
