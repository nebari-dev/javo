{{- /* With SQLite one pod runs both components as the controller's account (see javo.account). */ -}}
{{- $accounts := list "controller" "gateway" }}
{{- if eq (include "javo.engine" .) "sqlite" }}
{{- $accounts = list "controller" }}
{{- end }}
{{- range $c := $accounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: javo-{{ $c }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "javo.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $c }}
{{- end }}
