{{- /* RBAC cannot say which namespaces the controller may bind roles in or
which namespace labels it may change: it needs cluster-wide rolebindings and
namespaces rights because the namespaces apps live in are created later, and
create on Secrets and pods cannot be narrowed by name or content. These
ValidatingAdmissionPolicies (Kubernetes 1.30+) let the API server refuse
anything outside what the components do, so the chart refuses to render
without them. */ -}}
{{- $hasVAP := .Capabilities.APIVersions.Has "admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy" }}
{{- if not $hasVAP }}
{{- fail "Javo needs ValidatingAdmissionPolicy (admissionregistration.k8s.io/v1, Kubernetes 1.30+): its admission policies keep the components' namespace, RoleBinding, Secret and pod rights to what Javo does. Upgrade the cluster; with helm template or Argo CD pass --api-versions admissionregistration.k8s.io/v1/ValidatingAdmissionPolicy when the cluster serves it." }}
{{- end }}
{{- if $hasVAP }}
{{- $controller := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "javo.account" (list . "javo-controller")) }}
{{- $managed := include "javo.groupKey" "managed" }}
{{- $group := include "javo.group" . }}
{{- $shared := eq (include "javo.namespaceMode" .) "shared" }}
{{- /* Namespaces the controller may create: in shared mode the one
workspace namespace; in the other modes the ones its placement names
(<prefix>-<person or team>, except the release's own, which javo-system
matches with the default prefix) and the network probe's own namespace
(<release namespace>-netprobe, cut and hashed past 63 characters as the
controller does). It never takes over a namespace someone else made: in the
other modes an existing namespace becomes Javo's only when an admin labels it
managed; in shared mode the workspace namespace may be made by the chart or by
an admin (createWorkspaceNamespace=false), and the controller labels it. */ -}}
{{- $probe := printf "%s-netprobe" .Release.Namespace }}
{{- if gt (len $probe) 63 }}
{{- $probe = printf "%s-%s" (regexReplaceAll "-+$" (substr 0 54 $probe) "") (substr 0 8 (sha256sum $probe)) }}
{{- end }}
{{- $create := printf "((object.metadata.name.startsWith('%s-') && object.metadata.name != '%s') || object.metadata.name == '%s')" ((default (dict) .Values.config.namespaces).prefix | default "javo") .Release.Namespace $probe }}
{{- $adopt := "false" }}
{{- if $shared }}
{{- $create = printf "object.metadata.name == '%s'" .Values.workspaceNamespace }}
{{- $adopt = $create }}
{{- end }}
{{- $name := printf "%s-%s-javo-controller-namespaces" .Release.Name .Release.Namespace }}
# Namespaces the controller creates and patches: it creates only the ones its
# placement names, always managed and Pod Security restricted; it patches only
# managed ones (and in shared mode the workspace namespace); and it sets only
# Javo's labels and annotations plus the restricted Pod Security level.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: [namespaces]
        operations: [CREATE, UPDATE]
  matchConditions:
    - name: controller
      expression: request.userInfo.username == '{{ $controller }}'
  variables:
    - name: creating
      expression: request.operation == 'CREATE'
    - name: oldLabels
      expression: "variables.creating ? {} : oldObject.metadata.?labels.orValue({})"
    - name: newLabels
      expression: object.metadata.?labels.orValue({})
    - name: oldAnnotations
      expression: "variables.creating ? {} : oldObject.metadata.?annotations.orValue({})"
    - name: newAnnotations
      expression: object.metadata.?annotations.orValue({})
    - name: changedLabels
      expression: >-
        variables.newLabels.filter(k, !(k in variables.oldLabels) || variables.oldLabels[k] != variables.newLabels[k])
        + variables.oldLabels.filter(k, !(k in variables.newLabels))
    - name: changedAnnotations
      expression: >-
        variables.newAnnotations.filter(k, !(k in variables.oldAnnotations) || variables.oldAnnotations[k] != variables.newAnnotations[k])
        + variables.oldAnnotations.filter(k, !(k in variables.newAnnotations))
  validations:
    - expression: >-
        variables.creating
        ? {{ $create }}
        : (variables.oldLabels[?'{{ $managed }}'].orValue('') == 'true' || {{ $adopt }})
      message: the Javo controller may create only the namespaces its placement names, and change only namespaces labelled {{ $managed }}=true
    - expression: >-
        !variables.creating
        || (variables.newLabels[?'{{ $managed }}'].orValue('') == 'true'
            && ['enforce', 'warn', 'audit'].all(m, variables.newLabels[?('pod-security.kubernetes.io/' + m)].orValue('') == 'restricted'))
      message: the Javo controller may create a namespace only labelled {{ $managed }}=true with every Pod Security label restricted
    - expression: >-
        variables.changedLabels.all(k, k.startsWith('{{ $group }}/')
        || (k in ['pod-security.kubernetes.io/enforce', 'pod-security.kubernetes.io/warn', 'pod-security.kubernetes.io/audit']
            && k in variables.newLabels && variables.newLabels[k] == 'restricted')
        || (variables.creating && k == 'kubernetes.io/metadata.name'))
      message: the Javo controller may set only {{ $group }}/ labels, and Pod Security labels only to restricted
    - expression: variables.changedAnnotations.all(k, k.startsWith('{{ $group }}/'))
      message: the Javo controller may set only {{ $group }}/ annotations
    - expression: >-
        variables.creating
        || (object.spec == oldObject.spec && object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([]))
      message: the Javo controller may change only labels and annotations of a namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- if not $shared }}
{{- $name = printf "%s-%s-javo-controller-rolebindings" .Release.Name .Release.Namespace }}
---
# RoleBindings the controller makes in each managed namespace
# (--app-role-binding): only there, and only to the two app ClusterRoles.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [rbac.authorization.k8s.io]
        apiVersions: ["*"]
        resources: [rolebindings]
        operations: [CREATE, UPDATE, DELETE]
  matchConditions:
    - name: controller
      expression: request.userInfo.username == '{{ $controller }}'
  variables:
    - name: namespaceLabels
      expression: namespaceObject.metadata.?labels.orValue({})
    - name: subjects
      expression: "request.operation == 'DELETE' ? [] : object.?subjects.orValue([])"
  validations:
    - expression: >-
        '{{ $managed }}' in variables.namespaceLabels && variables.namespaceLabels['{{ $managed }}'] == 'true'
      message: the Javo controller may change RoleBindings only in namespaces labelled {{ $managed }}=true
    - expression: >-
        request.operation == 'DELETE'
        || variables.namespaceLabels[?'pod-security.kubernetes.io/enforce'].orValue('') == 'restricted'
      message: the Javo controller may bind roles only in namespaces whose Pod Security level is restricted
    # Each app ClusterRole goes to its own component's service account and to
    # nothing else: a binding to a group or another account would hand it the
    # Secrets and pod rights of the namespace.
    - expression: >-
        request.operation == 'DELETE'
        || (object.roleRef.kind == 'ClusterRole' && size(variables.subjects) == 1
            && variables.subjects[0].kind == 'ServiceAccount'
            && variables.subjects[0].?namespace.orValue('') == '{{ .Release.Namespace }}'
            && ((object.roleRef.name == '{{ include "javo.appRoleName" (list . "javo-gateway") }}'
                 && variables.subjects[0].name == '{{ include "javo.account" (list . "javo-gateway") }}')
                || (object.roleRef.name == '{{ include "javo.appRoleName" (list . "javo-controller") }}'
                 && variables.subjects[0].name == '{{ include "javo.account" (list . "javo-controller") }}')))
      message: the Javo controller may bind only the chart's app ClusterRoles, each to its own component's service account
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
{{- $gatewayUser := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "javo.account" (list . "javo-gateway")) }}
{{- $name = printf "%s-%s-javo-no-token-secrets" .Release.Name .Release.Namespace }}
---
# Secrets either component writes: never a service-account-token Secret,
# which Kubernetes fills with a token that does not expire. Both may create
# Secrets (create cannot be limited by name) and read some by name, so either
# could otherwise mint a lasting credential for any service account in a
# namespace it writes to.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: [secrets]
        operations: [CREATE, UPDATE]
  matchConditions:
    - name: javo
      expression: request.userInfo.username in ['{{ $controller }}', '{{ $gatewayUser }}']
  validations:
    - expression: object.?type.orValue('') != 'kubernetes.io/service-account-token'
      message: Javo's components may not create service account token Secrets
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- /* With SQLite the one pod runs the gateway as the controller's account,
which creates every kind of app pod, so the gateway's pods cannot be told
apart there: this policy needs database.engine=postgres. */ -}}
{{- if eq (include "javo.engine" .) "postgres" }}
{{- $gateway := printf "system:serviceaccount:%s:%s" .Release.Namespace (include "javo.account" (list . "javo-gateway")) }}
{{- $role := include "javo.groupKey" "role" }}
{{- $name = printf "%s-%s-javo-gateway-pods" .Release.Name .Release.Namespace }}
---
# Pods the internet-facing gateway creates (it may create pods in workspace
# namespaces for the file picker): only file pods, which run the files image
# with claims read-only and no Secret, service account token or host path.
# A pod creator could otherwise mount any Secret or claim there.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        resources: [pods]
        operations: [CREATE, UPDATE]
  matchConditions:
    - name: gateway
      expression: request.userInfo.username == '{{ $gateway }}'
  variables:
    # The home claim of the file pod's owner, or '' for any other pod name.
    - name: ownHome
      expression: >-
        object.metadata.name.startsWith('javo-files-')
        ? 'home-' + object.metadata.name.substring(size('javo-files-'))
        : ''
    - name: containers
      expression: >-
        object.spec.containers + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: object.metadata.?labels.orValue({})[?'{{ $role }}'].orValue('') == 'files'
      message: the Javo gateway may create only file pods (labelled {{ $role }}=files)
    - expression: >-
        size(object.spec.?initContainers.orValue([])) == 0
        && variables.containers.all(c, c.image == '{{ .Values.files.image }}')
      message: the Javo gateway's pods may run only the files image, without init containers
    # A claim is read-only, except the home of the file pod's own owner
    # (pod javo-files-<owner>, volume "home", claim home-<owner> or
    # home-<owner>-<generation>): the file editor saves through it.
    - expression: >-
        object.spec.?volumes.orValue([]).all(v, has(v.emptyDir)
        || (has(v.persistentVolumeClaim) && (v.persistentVolumeClaim.?readOnly.orValue(false)
        || (v.name == 'home' && variables.ownHome != ''
        && (v.persistentVolumeClaim.claimName == variables.ownHome
        || (v.persistentVolumeClaim.claimName.startsWith(variables.ownHome + '-')
        && v.persistentVolumeClaim.claimName.substring(size(variables.ownHome) + 1).matches('^[0-9]+$')))))))
      message: the Javo gateway's pods may mount only emptyDir volumes and claims read-only, except their owner's own home
    - expression: >-
        variables.containers.all(c, size(c.?envFrom.orValue([])) == 0
        && c.?env.orValue([]).all(e, !has(e.valueFrom)))
      message: the Javo gateway's pods may set only literal environment variables
    - expression: object.spec.?automountServiceAccountToken.orValue(true) == false
      message: the Javo gateway's pods may not mount a service account token
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}
  validationActions: [Deny]
{{- end }}
{{- end }}
