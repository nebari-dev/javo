{{- /*
The key the gateway seals each session's identity provider tokens with
(refresh and id token), so a copy of the database, such as a backup, holds
no live session. 32 random bytes, made once like the secrets key: an upgrade
looks up the live Secret and keeps it, and it is immutable so a render that
cannot look it up (helm template, Argo CD) fails to apply instead of
replacing it. Losing it only signs everyone out. Only the gateway mounts it.
secrets.existingSessionsKeySecret names a Secret made elsewhere instead.
*/ -}}
{{- if not .Values.secrets.existingSessionsKeySecret }}
{{- $live := lookup "v1" "Secret" .Release.Namespace "javo-sessions-key" }}
apiVersion: v1
kind: Secret
metadata:
  name: javo-sessions-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
immutable: true
data:
  {{- if and $live $live.data (index $live.data "key") }}
  key: {{ index $live.data "key" }}
  {{- else }}
  key: {{ randBytes 32 }}
  {{- end }}
{{- end }}
