{{- /*
The password every backup in the bucket is encrypted with (restic). Made
once: an upgrade looks up the live Secret and keeps it. Kept on uninstall and
immutable, like the secrets key: a new password could not read the backups
already in the bucket. Back it up apart from the cluster; a new install
pointed at the same bucket needs it (site/src/content/docs/admin/backups.mdx).
backupTarget.password.existingSecret names a Secret made elsewhere instead.
*/ -}}
{{- if and (include "javo.bucketEnabled" .) (not .Values.backupTarget.password.existingSecret) }}
{{- $live := lookup "v1" "Secret" .Release.Namespace "javo-backup-password" }}
apiVersion: v1
kind: Secret
metadata:
  name: javo-backup-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
immutable: true
data:
  {{- if and $live $live.data (index $live.data "password") }}
  password: {{ index $live.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 48 | b64enc }}
  {{- end }}
{{- end }}
