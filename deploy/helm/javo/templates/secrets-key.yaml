{{- /*
The key-encryption key (KEK) of people's secrets: 32 random bytes that wrap
the data keyset in the database and are never stored there. Made once: an
upgrade looks up the live Secret and keeps its key. Kept on uninstall, and
immutable, so a render that cannot look it up (helm template, Argo CD) fails
to apply instead of replacing it: a new key would leave every stored secret
unreadable. Only the controller mounts it. secrets.existingKeySecret names a
Secret made elsewhere instead.
*/ -}}
{{- if not .Values.secrets.existingKeySecret }}
{{- $live := lookup "v1" "Secret" .Release.Namespace "javo-secrets-key" }}
apiVersion: v1
kind: Secret
metadata:
  name: javo-secrets-key
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "javo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
type: Opaque
immutable: true
data:
  {{- if and $live $live.data (index $live.data "kek") }}
  kek: {{ index $live.data "kek" }}
  {{- else }}
  kek: {{ randBytes 32 }}
  {{- end }}
{{- end }}
