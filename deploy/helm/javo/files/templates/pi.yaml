apiVersion: javo.nebari.dev/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: pi
spec:
  # Runs without a password: access control is the javo-apps NetworkPolicy
  # (helm value networkPolicy.enabled) plus gateway authentication. The CNI
  # must enforce NetworkPolicy (k3s does; verify on kind).
  displayName: pi coding agent
  description: pi coding agent
  category: agents
  kind: pi
  # The terminal runs code as you, with your home folder: never shared.
  maxSharing: Private
  # Runs the platform's pixi image (environments.pixiImage) in the pixi
  # environment pod/files/envs/agents (conda-forge, every package pinned by
  # pixi.lock), installed into the owner's home on the first start and reused
  # after (internal/pixienv). An environment picked from Nebi, or a pixi.lock
  # at the root of the app's repository, is installed instead and must bring
  # the framework. Set workspaceTemplates.<name>.image to use a mirror.
  environment: agents
  # The environment has ttyd, tmux, git, ripgrep, fd and pi (conda-forge:
  # pod/files/envs/agents). No API key is baked in: with agentModel below pi
  # uses the admin's model through the gateway (config.ai.agent), or the
  # person's own key from Settings > AI agent; with neither, pi signs in with
  # its own flow in the terminal (/login) and keeps its credentials in the
  # home folder (~/.pi/agent).
  port: 7681
  # pod-user.sh gives the pod's uid a passwd entry, then runs the rest.
  command: ["/opt/javo/pod-user.sh"]
  args:
    - "ttyd"
    - "--port={{.Port}}"
    # ttyd is read-only unless told otherwise.
    - "--writable"
    # Refuse a websocket whose Origin is not the host the page came from.
    - "--check-origin"
    # The terminal page: Fira Code, and OSC 52 copy to the browser clipboard.
    - "--index=/opt/javo/agents/terminal.html"
    # Every tab attaches to the one tmux session, so the agent keeps running
    # when a tab closes. pi-start.sh sets pi's model up, runs pi with the
    # app's first prompt on its first start, and leaves a shell in the folder
    # when pi quits.
    - "tmux"
    - "-f"
    - "/opt/javo/agents/tmux.conf"
    - "new-session"
    - "-A"
    - "-s"
    - "agent"
    - "-c"
    - "{{if .File}}{{.File}}{{else}}{{.Home}}{{end}}"
    - "/opt/javo/agents/pi-start.sh"
  # ttyd serves at /; its page finds the websocket relative to its own URL.
  basePath: Strip
  appLogin: Disabled
  fileExtensions: []
  # The kubelet reaches the pod directly, so no prefix here.
  readinessPath: "/"
  # What an app or a job runs at when no size is picked (as a custom amount,
  # or the smallest size that holds it); not measured yet, a conservative
  # amount no bigger than the chart's small size.
  defaultResources: {cpu: 500m, memory: 1Gi}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  sample:
    path: /opt/javo/samples/pi
    title: Starter project
  # The app gets an API token of its owner (JAVO_URL, JAVO_TOKEN) and a
  # guide to the API. pi reads AGENTS.md from the folders above the one it
  # runs in, and the home folder is /home/user.
  apiToken: true
  apiGuidePaths: [/home/AGENTS.md]
  # Its token may create, change, restart and delete the owner's apps and
  # jobs that hold no secret, API token or Nebi token; anything else is left
  # to the person in the browser.
  agentDeploy: true
  # It gets the admin's agent model (or the person's own key) and the first
  # prompt of "Build with pi" in the search bar.
  agentModel: true
