apiVersion: javo.nebari.dev/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: claude-code
spec:
  # Runs without a password: access control is the javo-apps NetworkPolicy
  # (helm value networkPolicy.enabled) plus gateway authentication. The CNI
  # must enforce NetworkPolicy (k3s does; verify on kind).
  displayName: Claude Code
  description: Claude coding agent
  category: agents
  kind: claude-code
  # The terminal runs code as you, with your home folder: never shared.
  maxSharing: Private
  # Runs the platform's pixi image (environments.pixiImage) in the pixi
  # environment pod/files/envs/agents (conda-forge, every package pinned by
  # pixi.lock), installed into the owner's home on the first start and reused
  # after (internal/pixienv). An environment picked from Nebi, or a pixi.lock
  # at the root of the app's repository, is installed instead and must bring
  # the framework. Set workspaceTemplates.<name>.image to use a mirror.
  environment: agents
  # The environment has ttyd, tmux, git, ripgrep, fd and Claude Code (from
  # npm, by package-lock.json: pod/files/envs/agents). No API key is baked
  # in: Claude Code signs in with its own flow in the terminal and keeps its
  # credentials in the home folder (~/.claude).
  port: 7681
  # pod-user.sh gives the pod's uid a passwd entry, then runs the rest.
  command: ["/opt/javo/pod-user.sh"]
  args:
    # agent-serve.sh starts the agent in a detached tmux session (tmux.conf
    # from the pod files) in this folder at container start, then runs the
    # ttyd below with a tmux attached to it: every tab attaches to the one
    # session, so the agent works before any tab opens and keeps running
    # when a tab closes.
    - "/opt/javo/agents/agent-serve.sh"
    - "{{if .File}}{{.File}}{{else}}{{.Home}}{{end}}"
    # Every start, a pod restart included, reopens the folder's most recent
    # conversation (claude --continue). With none, --continue exits 1 with
    # "No conversation found to continue" and a new one starts. Quitting the
    # agent leaves a shell in the folder.
    - "claude --continue || claude; exec bash"
    - "ttyd"
    - "--port={{.Port}}"
    # ttyd is read-only unless told otherwise.
    - "--writable"
    # Refuse a websocket whose Origin is not the host the page came from.
    - "--check-origin"
    # The terminal page: Fira Code, and OSC 52 copy to the browser clipboard.
    - "--index=/opt/javo/agents/terminal.html"
  # ttyd serves at /; its page finds the websocket relative to its own URL.
  basePath: Strip
  appLogin: Disabled
  fileExtensions: []
  # The kubelet reaches the pod directly, so no prefix here.
  readinessPath: "/"
  # What an app runs at when no size is picked (as a custom amount, or the
  # smallest size that holds it). The agent installs packages and runs
  # builds (npm install plus a bundler for a React app needed over 1Gi and
  # was OOMKilled at 1Gi). 1 CPU keeps it small enough to share a node with
  # the owner's other apps, which run on the node holding their home disk.
  defaultResources: {cpu: "1", memory: 3Gi}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 2Gi}
  sample:
    path: /opt/javo/samples/claude-code
    title: Starter project
  # The app gets an API token of its owner, held by a helper sidecar that
  # javo-api calls through (the agent never has JAVO_TOKEN), and a
  # guide to the API, which Claude Code reads as its managed instructions
  # file.
  apiToken: true
  apiGuidePaths: [/etc/claude-code/CLAUDE.md]
  # Its token may create, change, restart and delete the owner's apps and
  # jobs that hold no secret, API token or Nebi token; anything else is left
  # to the person in the browser.
  agentDeploy: true
