apiVersion: javo.nebari.dev/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: container
spec:
  # Installed while containerImages.enabled is true; the gateway checks each
  # image against containerImages.allowedRegistries. Runs without a token:
  # access control is the javo-apps NetworkPolicy (helm value
  # networkPolicy.enabled) plus gateway authentication.
  displayName: Container image
  description: Any web image
  category: web
  kind: container
  # Each app names its image and port; 8080 is the port offered first.
  userImage: true
  port: 8080
  # An optional command replaces the image's default command (its CMD).
  userCommand: Optional
  # The gateway removes the URL prefix, so an image that serves at / works
  # under a path and on its own subdomain.
  basePath: Strip
  appLogin: Disabled
  # What an app or a job runs at when no size is picked (as a custom amount,
  # or the smallest size that holds it); measured 2026-11-03: the nginx sample
  # peaks at 20Mi.
  defaultResources: {cpu: 100m, memory: 256Mi}
  # nginx-unprivileged runs as its own non-root user, serves its welcome page
  # at / on 8080 and is pinned by digest (DEPENDENCIES.md); the same image
  # serves the static-site template.
  sample:
    image: nginxinc/nginx-unprivileged:1.31.6-alpine-slim@sha256:ac4d9c7e457c6510b95ac72dd84b27f7cc68ecb9a83fbd44f05a6460cf08aba4
    title: nginx welcome page
