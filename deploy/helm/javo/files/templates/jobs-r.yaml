apiVersion: javo.nebari.dev/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: jobs-r
spec:
  # Job-only: runs R notebooks and scripts in the background. It is marked
  # jobOnly, so it is not offered as an app and has no app sample (it has a
  # sample job, below); the fields below that only an app needs (kind, port,
  # command) are placeholders the schema requires.
  jobOnly: true
  displayName: R jobs
  description: R jobs
  category: jobs
  kind: r
  # Runs the platform's pixi image (environments.pixiImage) in the pixi
  # environment pod/files/envs/jobs-r (conda-forge, every package pinned by
  # pixi.lock), installed into the owner's home on the first start and reused
  # after (internal/pixienv). An environment picked from Nebi, or a pixi.lock
  # at the root of the app's repository, is installed instead and must bring
  # the framework. Set workspaceTemplates.<name>.image to use a mirror.
  environment: jobs-r
  port: 8080
  command: ["true"]
  appLogin: Disabled
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 4Gi}
  jobs:
    engines: [papermill, command]
    kernels: [ir]
    # Offered on the Jobs page as "Try a sample job": a script of the pod
    # files (pod/files/samples/jobs-r) that greets its name parameter.
    sample:
      title: Say hello in R
      command: Rscript /opt/javo/samples/jobs-r/hello.R
      parameters:
        - {name: name, type: string, default: javo}
