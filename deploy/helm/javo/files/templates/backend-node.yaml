apiVersion: javo.nebari.dev/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: backend-node
spec:
  # Runs without a token: access control is the javo-apps NetworkPolicy
  # (helm value networkPolicy.enabled) plus gateway authentication. The CNI
  # must enforce NetworkPolicy (k3s does; verify on kind).
  displayName: Node back-end
  # The server must listen on $PORT and answer / with a success status.
  description: Node.js server
  category: web
  kind: node
  fromRepo: Optional
  # Runs the platform's pixi image (environments.pixiImage) in the pixi
  # environment pod/files/envs/backend-node (conda-forge, every package pinned by
  # pixi.lock), installed into the owner's home on the first start and reused
  # after (internal/pixienv). An environment picked from Nebi, or a pixi.lock
  # at the root of the app's repository, is installed instead and must bring
  # the framework. Set workspaceTemplates.<name>.image to use a mirror.
  environment: backend-node
  port: 8080
  # The command each app types runs in the repository folder (or the folder of
  # the chosen home file, else the home) and serves on {{.Port}}, through
  # pod-user.sh, which runs it in the environment (pod/files).
  command: ["/opt/javo/pod-user.sh"]
  userCommand: Required
  # The gateway removes the URL prefix, so the server serves at /.
  basePath: Strip
  appLogin: Disabled
  # The kubelet reaches the pod directly, so no prefix here.
  readinessPath: "/"
  # What an app or a job runs at when no size is picked (as a custom amount,
  # or the smallest size that holds it); measured 2026-11-03: 39Mi peak, 22Mi
  # idle.
  defaultResources: {cpu: 100m, memory: 256Mi}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 1Gi}
  # A plain http server with no packages (pod/files/samples/backend-node)
  # that shows the server time.
  sample:
    path: /opt/javo/samples/backend-node
    open: server.js
    title: Server time
    command: node server.js
