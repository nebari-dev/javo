apiVersion: javo.nebari.dev/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: jobs-python
spec:
  # Job-only: runs notebooks, scripts and documents in the background. It is
  # marked jobOnly, so it is not offered as an app and has no app sample (it
  # has a sample job, below); the fields below that only an app needs (kind,
  # port, command) are placeholders the schema requires.
  jobOnly: true
  displayName: Python jobs
  description: Python jobs
  category: jobs
  kind: python
  # Runs the platform's pixi image (environments.pixiImage) in the pixi
  # environment pod/files/envs/jobs-python (conda-forge, every package pinned by
  # pixi.lock), installed into the owner's home on the first start and reused
  # after (internal/pixienv). An environment picked from Nebi, or a pixi.lock
  # at the root of the app's repository, is installed instead and must bring
  # the framework. Set workspaceTemplates.<name>.image to use a mirror.
  environment: jobs-python
  port: 8080
  command: ["true"]
  appLogin: Disabled
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 4Gi}
  jobs:
    engines: [papermill, marimo, quarto, command]
    kernels: [python3]
    # Offered on the Jobs page as "Try a sample job": a bash script of the pod
    # files (pod/files/samples/jobs) that prints the time, the host, the
    # user, the folder and its greeting parameter.
    sample:
      title: Print the time
      command: bash /opt/javo/samples/jobs/print-time.sh
      parameters:
        - {name: greeting, type: string, default: Hello from javo}
