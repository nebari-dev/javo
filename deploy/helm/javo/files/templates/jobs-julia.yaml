apiVersion: javo.nebari.dev/v1alpha1
kind: WorkspaceTemplate
metadata:
  name: jobs-julia
spec:
  # Job-only: runs Julia notebooks and scripts in the background. It is marked
  # jobOnly, so it is not offered as an app and has no app sample (it has a
  # sample job, below); the fields below that only an app needs (kind, port,
  # command) are placeholders the schema requires.
  jobOnly: true
  displayName: Julia jobs
  description: Julia jobs
  category: jobs
  kind: julia
  # Runs the platform's pixi image (environments.pixiImage) in the pixi
  # environment pod/files/envs/jobs-julia (conda-forge, every package pinned by
  # pixi.lock), installed into the owner's home on the first start and reused
  # after (internal/pixienv). An environment picked from Nebi, or a pixi.lock
  # at the root of the app's repository, is installed instead and must bring
  # the framework. Set workspaceTemplates.<name>.image to use a mirror.
  environment: jobs-julia
  port: 8080
  command: ["true"]
  appLogin: Disabled
  # What an app or a job runs at when no size is picked (as a custom amount,
  # or the smallest size that holds it); not measured yet, a conservative
  # amount no bigger than the chart's small size.
  defaultResources: {cpu: 1, memory: 2Gi}
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 4Gi}
  jobs:
    engines: [papermill, command]
    kernels: [julia]
    # Offered on the Jobs page as "Try a sample job": a script of the pod
    # files (pod/files/samples/jobs-julia) that greets its name parameter.
    sample:
      title: Say hello in Julia
      command: julia /opt/javo/samples/jobs-julia/hello.jl
      parameters:
        - {name: name, type: string, default: javo}
